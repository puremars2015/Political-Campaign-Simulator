name: political-campaign-simulator-local
services:
  game:
    image: political-campaign-simulator:local-v1
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${GAME_PORT:-8787}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      NEWS_UPDATES: "${NEWS_UPDATES:-0}"
      NEWS_DATA_DIR: /app/data
    volumes:
      - news-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
volumes:
  news-data:
